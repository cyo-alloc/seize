# This is the main CI workflow that runs the test suite on all pushes to main and all pull requests.
# It runs the following jobs:
# - required: runs the test suite on ubuntu with stable and beta rust toolchains
#   requirements of this crate, and its dependencies
# - os-check: runs the test suite on mac and windows
# See check.yml for information about how the concurrency cancellation and workflow triggering works
permissions:
  contents: read
on:
  push:
    branches: [master, cyo-alloc]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: test
jobs:
  required:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: ubuntu / ${{ matrix.toolchain }}
    strategy:
      matrix:
        # run on stable and beta to ensure that tests won't break on the next version of the rust
        # toolchain
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: cargo generate-lockfile
        # enable this ci template to run regardless of whether the lockfile is checked in or not
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile
      # https://twitter.com/jonhoo/status/1571290371124260865
      - name: cargo test --locked
        run: cargo test --locked --all-features --all-targets
      # https://github.com/rust-lang/cargo/issues/6669
      - name: cargo test --doc
        run: cargo test --locked --all-features --doc

      # The `core` + `alloc` build has its own reclamation path and its own
      # synchronization primitives, exercised by the `owned_guard` suite.
      - name: cargo test --no-default-features
        run: cargo test --locked --no-default-features
  os-check:
    # run cargo test on mac and windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    name: ${{ matrix.os }} / stable
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - name: cargo generate-lockfile
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile
      - name: cargo test
        run: cargo test --locked --all-features --all-targets
  minimal-versions:
    # cargo-minimal-versions checks that the crate works with the minimum versions of its
    # dependencies.
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / stable / minimal-versions
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - name: cargo install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      - name: cargo install cargo-minimal-versions
        uses: taiki-e/install-action@cargo-minimal-versions
      - name: cargo minimal-versions test
        run: cargo minimal-versions test --all-features --all-targets

  freestanding:
    # Build and RUN the `no_std` configuration on real targets: a Cortex-M4
    # under qemu, covering the spin-latch mode on the thumbv7em ISA, and a
    # libc-free Linux binary whose host lock makes raw futex syscalls through
    # rustix, covering the registered-lock mode. The linux binary must also
    # have no dynamic linkage at all.
    runs-on: ubuntu-latest
    name: ubuntu / stable / freestanding
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - name: Install qemu
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      - name: run the cortex-m tests under qemu
        working-directory: freestanding/cortex-m-qemu
        run: cargo run --release
      - name: build the no-libc linux tests
        working-directory: freestanding/linux-nolibc
        run: cargo build --release
      - name: check that no libc is linked, dynamically or statically
        run: |
          BIN=freestanding/linux-nolibc/target/x86_64-unknown-linux-gnu/release/linux-nolibc
          if readelf --dynamic "$BIN" | grep NEEDED; then
            echo "the binary links against a shared library"
            exit 1
          fi
          if nm "$BIN" | grep -iE "__libc|__glibc"; then
            echo "the binary contains statically linked libc code"
            exit 1
          fi
      - name: run the no-libc linux tests
        run: ./freestanding/linux-nolibc/target/x86_64-unknown-linux-gnu/release/linux-nolibc
